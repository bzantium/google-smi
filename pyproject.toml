[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-smi"
version = "0.2.0"
description = "nvidia-smi-style TPU monitor CLI"
requires-python = ">=3.10"
dependencies = [
    "protobuf>=4.25",
    "grpcio",
]

[project.scripts]
google-smi = "google_smi.cli:main"
